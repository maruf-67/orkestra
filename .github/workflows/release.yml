name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC) and harmless when using a
      # classic NODE_AUTH_TOKEN.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      # pnpm must be installed before setup-node, because `cache: pnpm` shells
      # out to `pnpm store path` during the setup-node step.
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Run tests
        run: pnpm test

      - name: Publish to npm
        # `npm publish` uses the .npmrc written by setup-node (registry-url +
        # NODE_AUTH_TOKEN). pnpm prefers OIDC trusted publishing, which fails
        # outright when only a classic token is configured.
        run: npm publish --provenance=false --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
