name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # Required for npm trusted publishing (OIDC). Harmless when publishing
      # with a classic NODE_AUTH_TOKEN.
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Install bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Run tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: Publish to npm
        # `npm publish` uses the .npmrc written by setup-node (registry-url +
        # NODE_AUTH_TOKEN). `bun publish` prefers OIDC trusted publishing and
        # aborts when only a classic token is configured.
        run: npm publish --provenance=false --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}